<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sneakylink</title>
    <script src="assets/jquery-4.0.0.min.js"></script>
    <script src="assets/sparticles.js"></script>
    <script src="assets/sparticles.min.js"></script>
    <script>
    $(function() {
	  var $main = $(".bbox");
	  window.mySparticles = new Sparticles($main.get(0), {
        shape:"square",
        rotate: true,
        direction: 90,
        alphaSpeed: 0,
        yVariance:0,
        color: "green",
        maxSize: 15,
        minSize: 5,
        speed: 10,
        count: 35,
        drift: 0
      });
	});
    </script>
    <style>
    @font-face {
  font-family: 'Pixelta';
  src: url('assets/Pixelta.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap; /* Shows fallback font until custom font loads */
    }
    @font-face {
  font-family: 'PixelPurl';
  src: url('assets/PixelPurl.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap; /* Shows fallback font until custom font loads */
    }

        .bbox {
            height: 100vh;
            width:100vw;
            background-color: black;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .title {

            font-family: 'Pixelta', Arial, sans-serif;
            font-size: 40px;
            color: rgb(25, 188, 188);
            position: absolute;
            top: 10vh;        
            left: 15vw;
            letter-spacing: 1.1px;  
            text-align: center;
            width: 60vw
            
        }
        .bbody {
            font-family: 'PixelPurl', Arial, sans-serif;
            font-size: 22px;
            color: #c9dbff;
            position: absolute;
            top: 30vh;        
            left: 10vw;
            width:70vw;
            text-align: center;
        }
        .addy {
            font-family: 'PixelPurl', Arial, sans-serif;
            font-size: 18px;
            color: #c9dbff;
            position: absolute;
            top: 5vh;        
            right: 5vw;
            width:15vw;
            font-style:italic;
        }
        .slot {
           border-bottom: 2px solid white;
           width:100%;
           text-align: center;
           margin: 5px;
        }
        .sign {
            font-family: 'PixelPurl', Arial, sans-serif;
            font-size: 31px;
            color: #f997e4;
            position: absolute;
            top: 90vh;        
            left: 15vw;
            width:15vw;
            font-style:italic;
        }
        .link {
            font-family: 'PixelPurl', Arial, sans-serif;
            font-size: 15px;
            color: #ed1b0c;
            text-decoration: underline;
            position: absolute;
            width:15vw; 
            font-style:italic;
            
        }
    </style>
</head>
<body>
<div class="bbox"></div>
<div class="title">
        <img src="assets/images.jpg" alt="description text">
    </div>
</body>
</html>
